name: Build Norm

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NormJS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build NormJS
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: normjs-build-${{ github.sha }}
          path: build

  package_windows:
    if: github.event_name == 'workflow_dispatch'
    name: Package Windows Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build Windows portable package
        run: npm run package:windows

      - name: Verify Windows portable package output
        shell: powershell
        run: |
          if (!(Test-Path ".\release\windows-portable\Norm.exe")) {
            throw "Norm.exe was not created."
          }
          if (Test-Path ".\release\windows-portable\Norm.cmd") {
            throw "Norm.cmd should not be shipped in the EXE-only package."
          }
          if (!(Test-Path ".\media\norm_icon.ico")) {
            throw "Norm icon source file was not found."
          }
          $iconBytes = [System.IO.File]::ReadAllBytes((Resolve-Path ".\media\norm_icon.ico"))
          if ($iconBytes.Length -lt 6 -or [BitConverter]::ToUInt16($iconBytes, 0) -ne 0 -or [BitConverter]::ToUInt16($iconBytes, 2) -ne 1) {
            throw "Norm icon source file is not a valid ICO file."
          }
          $iconCount = [BitConverter]::ToUInt16($iconBytes, 4)
          $iconSizes = for ($index = 0; $index -lt $iconCount; $index++) {
            $offset = 6 + ($index * 16)
            $width = $iconBytes[$offset]
            if ($width -eq 0) { 256 } else { $width }
          }
          $requiredIconSizes = @(16, 24, 32, 48, 64, 128, 256)
          $missingIconSizes = $requiredIconSizes | Where-Object { $iconSizes -notcontains $_ }
          if ($missingIconSizes.Count -gt 0) {
            throw "Norm icon source file is missing required sizes: $($missingIconSizes -join ', ')."
          }
          Add-Type -AssemblyName System.Drawing
          $exePath = (Resolve-Path ".\release\windows-portable\Norm.exe").Path
          $associatedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($exePath)
          if ($null -eq $associatedIcon) {
            throw "Windows could not extract an associated icon from Norm.exe."
          }
          $associatedIcon.Dispose()
          $versionInfo = (Get-Item $exePath).VersionInfo
          if ($versionInfo.OriginalFilename -eq "node.exe" -or $versionInfo.ProductName -match "Node" -or $versionInfo.FileDescription -match "Node") {
            throw "Norm.exe still reports Node.js version metadata."
          }
          if ($versionInfo.OriginalFilename -ne "Norm.exe" -or $versionInfo.ProductName -ne "Norm" -or $versionInfo.FileDescription -ne "Norm") {
            throw "Norm.exe does not report expected Norm version metadata."
          }
          if (Test-Path ".\release\windows-portable\studio-tools") {
            throw "Portable package should not ship a studio-tools directory anymore."
          }
          if (Test-Path ".\release\windows-portable\studio-workspace") {
            throw "Portable package should not ship a studio-workspace directory anymore."
          }

      - name: Extract embedded Prisma Studio assets
        shell: powershell
        run: |
          & ".\release\windows-portable\Norm.exe" --extract-internal-assets
          if ($LASTEXITCODE -ne 0) {
            throw "Norm.exe failed to extract its embedded Prisma Studio assets."
          }

      - name: Smoke test extracted Prisma Studio CLI
        shell: powershell
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $assetRoot = ".\release\windows-portable\.norm-internal\sea-assets\$packageVersion\prisma-studio"

          if (!(Test-Path "$assetRoot\node.exe")) {
            throw "Extracted Prisma Studio node runtime was not found."
          }
          if (!(Test-Path "$assetRoot\tools\node_modules\prisma\build\index.js")) {
            throw "Extracted Prisma Studio CLI was not found."
          }
          if (!(Test-Path "$assetRoot\tools\prisma.studio.config.js")) {
            throw "Extracted Prisma Studio config was not found."
          }
          if (!(Test-Path "$assetRoot\workspace\prisma\schema.prisma")) {
            throw "Extracted Prisma Studio schema was not found."
          }
          if (!(Test-Path "$assetRoot\tools\node_modules\@prisma\dev\dist\state.cjs")) {
            throw "Extracted Prisma Studio @prisma/dev runtime was not found."
          }

          & "$assetRoot\node.exe" `
            "$assetRoot\tools\node_modules\prisma\build\index.js" `
            studio --help
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Prisma Studio CLI failed to start."
          }

          & "$assetRoot\node.exe" `
            -e "require(process.argv[1]); console.log('ok')" `
            "$assetRoot\tools\node_modules\@prisma\dev\dist\state.cjs"
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Prisma Studio runtime dependencies were not complete."
          }

      - name: Smoke test packaged executable
        shell: powershell
        run: |
          Remove-Item -Force ".\release\windows-portable\.env" -ErrorAction SilentlyContinue
          $output = & ".\release\windows-portable\Norm.exe" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Out-String | Write-Host
          if ($exitCode -eq 0) {
            throw "Norm.exe unexpectedly exited successfully without a .env file."
          }
          if (($output | Out-String) -notmatch "No environment variable named token") {
            throw "Norm.exe did not report the expected missing token error."
          }

      - name: Clean extracted internal assets before upload
        shell: powershell
        run: |
          Remove-Item -Recurse -Force ".\release\windows-portable\.norm-internal" -ErrorAction SilentlyContinue

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: normjs-windows-portable-${{ github.sha }}
          path: release/windows-portable
