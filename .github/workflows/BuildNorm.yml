name: Build Norm

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NormJS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build NormJS
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: normjs-build-${{ github.sha }}
          path: build

  package_windows:
    if: github.event_name == 'workflow_dispatch'
    name: Package Windows Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build Windows portable package
        run: npm run package:windows

      - name: Verify Windows portable package output
        shell: powershell
        run: |
          if (!(Test-Path ".\release\windows-portable\Norm.exe")) {
            throw "Norm.exe was not created."
          }
          if (!(Test-Path ".\release\windows-portable\Norm.cmd")) {
            throw "Norm.cmd was not created."
          }
          if (!(Test-Path ".\release\windows-portable\studio-tools\node.exe")) {
            throw "Bundled Prisma Studio node runtime was not created."
          }
          if (!(Test-Path ".\release\windows-portable\studio-tools\node_modules\prisma\build\index.js")) {
            throw "Bundled Prisma Studio CLI was not created."
          }
          if (!(Test-Path ".\release\windows-portable\studio-workspace\prisma.studio.config.ts")) {
            throw "Bundled Prisma Studio config was not created."
          }
          if (!(Test-Path ".\release\windows-portable\studio-workspace\prisma\schema.prisma")) {
            throw "Bundled Prisma Studio schema was not created."
          }

      - name: Smoke test bundled Prisma Studio CLI
        shell: powershell
        run: |
          & ".\release\windows-portable\studio-tools\node.exe" `
            ".\release\windows-portable\studio-tools\node_modules\prisma\build\index.js" `
            studio --help
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Prisma Studio CLI failed to start."
          }

      - name: Smoke test packaged executable
        shell: powershell
        run: |
          Remove-Item -Force ".\release\windows-portable\.env" -ErrorAction SilentlyContinue
          $output = & ".\release\windows-portable\Norm.exe" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Out-String | Write-Host
          if ($exitCode -eq 0) {
            throw "Norm.exe unexpectedly exited successfully without a .env file."
          }
          if (($output | Out-String) -notmatch "No environment variable named token") {
            throw "Norm.exe did not report the expected missing token error."
          }

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: normjs-windows-portable-${{ github.sha }}
          path: release/windows-portable
